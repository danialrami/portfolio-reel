[project]
name = "reels"
version = "0.1.0"
description = "A LUFS-family screen-capture & reel primitive: capture documents, reel documents, and the two contracts (verify / prove) over them."
requires-python = ">=3.12"
dependencies = []

[project.scripts]
reels = "reels.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
reels = ["py.typed"]

[dependency-groups]
dev = ["pytest>=8", "jsonschema>=4.23"]

[tool.pytest.ini_options]
testpaths = ["tests"]
